# Every push to 'staging' here asks impyar-backend to deploy the staging copy (it builds from the 'staging'
# branches of all three repos). Needs secret STAGING_DISPATCH_TOKEN (fine-grained token: impyar-backend, Contents read/write).
name: Trigger staging deploy
on:
  push:
    branches: [staging]
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask impyar-backend to deploy staging
        env:
          T: ${{ secrets.STAGING_DISPATCH_TOKEN }}
        run: |
          [ -n "$T" ] || { echo "secret STAGING_DISPATCH_TOKEN is missing"; exit 1; }
          curl -fsS -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/alirezaworktime-art/impyar-backend/dispatches \
            -d '{"event_type":"staging-deploy","client_payload":{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
          echo "staging deploy requested → https://github.com/alirezaworktime-art/impyar-backend/actions/workflows/staging-deploy.yml"
